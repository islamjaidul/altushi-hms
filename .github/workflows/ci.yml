# CI gates per staff_engineer_prompt G8/G15/G16/G18/G21. Red money test blocks merge — no [Skip].
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest   # docker available → Testcontainers works (spec 0005 conflict flag 3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore (locked mode — G15 pinning)
        run: dotnet restore hms-erp.slnx --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build hms-erp.slnx --no-restore -c Release
      - name: Guard scripts
        run: |
          sh eng/check-no-external-hosts.sh src
          sh eng/check-ui-tokens.sh src
          sh eng/check-fkeys.sh src
          sh eng/check-no-native-date.sh src
          bash eng/check-lifecycle-traceability.sh
          sh eng/check-published-content-tracked.sh
          sh eng/check-css-classes.sh src
      # Both of these catch defects that return HTTP 200 with correct markup, which is why every
      # route, permission and entitlement check passed over them for an entire release (spec 0036).
      - name: Icon subset covers every ligature used
        run: |
          python3 -m pip install --quiet fonttools brotli
          sh eng/check-icon-glyphs.sh src
      - name: Unit + architecture tests
        run: |
          dotnet test tests/Hms.Kernel.Tests --no-build -c Release
          dotnet test tests/Hms.Web.Tests --no-build -c Release
          dotnet test tests/Hms.Architecture.Tests --no-build -c Release
      - name: Integration tests (real PostgreSQL via Testcontainers — G7)
        run: dotnet test tests/Hms.Integration.Tests --no-build -c Release
      - name: Print golden tests
        run: dotnet test tests/Hms.PrintGolden.Tests --no-build -c Release
      - name: Vulnerable package scan (G15)
        run: |
          dotnet list hms-erp.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q 'has the following vulnerable packages' vuln.txt
      - name: Additive-migration gate (03 §12)
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Hms.Kernel --startup-project src/Hms.Web --context KernelDbContext -o kernel.sql
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Hms.Kernel --startup-project src/Hms.Web --context AuthDbContext -o auth.sql
          # reg carries patient identity and its ck_identity constraint (spec 0032, M1-D1); the
          # gate covered two of the fourteen contexts and neither was the one being widened.
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Registration/Hms.Registration --startup-project src/Hms.Web \
            --context RegDbContext -o reg.sql
          # hr carries payroll, which is money: a dropped column there loses a locked salary sheet,
          # and hard rule 4 says financial history is never destroyed (spec 0035).
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Hr/Hms.Hr --startup-project src/Hms.Web \
            --context HrDbContext -o hr.sql
          # diag carries the public report token and notif the SMS retry columns (spec 0039 WP6);
          # both contexts now change and were outside the gate.
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Diagnostics/Hms.Diagnostics --startup-project src/Hms.Web \
            --context DiagDbContext -o diag.sql
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Notifications/Hms.Notifications --startup-project src/Hms.Web \
            --context NotifDbContext -o notif.sql
          # emr and ipd carry the clinical record (MAR, care tasks, admissions, duty) — both
          # widened by spec 0041 and previously outside the gate.
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Emr/Hms.Emr --startup-project src/Hms.Web \
            --context EmrDbContext -o emr.sql
          dotnet ef migrations script --idempotent --no-build -c Release \
            --project src/Modules/Ipd/Hms.Ipd --startup-project src/Hms.Web \
            --context IpdDbContext -o ipd.sql
          sh eng/check-additive-migrations.sh kernel.sql
          sh eng/check-additive-migrations.sh auth.sql
          sh eng/check-additive-migrations.sh reg.sql
          sh eng/check-additive-migrations.sh hr.sql
          sh eng/check-additive-migrations.sh diag.sql
          sh eng/check-additive-migrations.sh notif.sql
          sh eng/check-additive-migrations.sh emr.sql
          sh eng/check-additive-migrations.sh ipd.sql
      - name: Image build
        run: docker build -f deploy/app.Dockerfile -t hms-app:ci .

  # ADR-0022 (spec 0015): boot the current build against the PREVIOUS release's data.
  # Clean-database-only testing hid a production defect once (spec 0013); never again.
  upgrade-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev-only-super
        ports: ["5455:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Upgrade gate
        run: bash eng/verify/upgrade/run.sh
        env:
          PGHOST: localhost
          PGPORT: "5455"
          PGUSER: postgres
          PGPASSWORD: dev-only-super
